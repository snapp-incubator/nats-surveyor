enabled: true

image:
  repository: ghcr.io/snapp-incubator/nats-surveyor
  # Defaults to .Chart.AppVersion (set automatically by the release workflow).
  tag: ""

nats:
  service: ""
  port: 4222
  adminSecret: nats-system-account

auth:
  enabled: true

# JetStream advisory collection. Surveyor opens a second connection, separate
# from the --user/--password monitoring one, to subscribe to $JS.EVENT.ADVISORY
# and $JS.EVENT.METRIC for a single account.
jetstream:
  # Account to collect advisories for.
  account: "$G"
  # Poll JetStream stream and consumer configuration and state.
  #
  # This poller is separate from the advisory listener and from the --user
  # monitoring connection: it opens its own client connection into a JetStream
  # account and walks the stream list. Turn it off where surveyor has no such
  # account to reach -- a cluster with no JetStream, or one whose JetStream
  # accounts surveyor holds no credentials for. Left on, it logs
  # "failed to start JetStream config list listener: nats: Authorization
  # Violation" once at startup and never retries.
  configList: true
  # Name of an existing Secret holding the advisory account config, mounted at
  # /etc/surveyor/jetstream in place of the generated ConfigMap. Set this when
  # the target account requires authentication: the generated ConfigMap carries
  # no credentials, so the advisory connection is anonymous and a server that
  # requires auth on that account rejects it with an Authorization Violation.
  #
  # The Secret holds one or more <id>.json files in surveyor's advisory config
  # format, which accepts "username"/"password" (also "credential", "nkey",
  # "token", and tls_* paths):
  #
  #   kubectl create secret generic nats-surveyor-advisory \
  #     --from-literal=rides.json='{"name":"$G","username":"...","password":"..."}'
  #
  # Keeping it a Secret rather than templating the password through values keeps
  # the credential out of the rendered chart and out of git.
  existingSecret: ""

cluster:
  size: 5

resources:
  requests:
    cpu: 500m
    memory: 500Mi
  limits:
    cpu: 2
    memory: 1Gi

service:
  port: 7777
  name: metrics

prometheus:
  serviceMonitor:
    enabled: true
    interval: 10s

# Extra command-line flags appended to nats-surveyor's args.
# Useful for opting into optional scrapes like --raftz or --expvarz
# without bumping the chart for every new flag.
#
# Per-subject JetStream stream state is opt-in here too, since it costs an extra
# STREAM.INFO request per stream and the server builds that state in
# O(subjects) on the stream leader:
#
#   extraArgs:
#     - --js-subjects
#     - --js-subjects-streams=rides,authentication
#     - --js-subjects-max=200
#     - --js-scrape-interval=30s
#
# Restrict to named streams unless every stream's subject space is known to be
# bounded — one wildcard stream turns every subject into its own series.
extraArgs: []
